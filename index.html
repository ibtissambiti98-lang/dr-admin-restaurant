<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم الوردة الذهبية الفاخر | L'Étoile Dorée</title>
    <style>
        :root {
            --gold: #c5a880;
            --gold-hover: #e2d1b9;
            --dark-black: #0a0a0a;
            --card-bg: #121212;
            --text-gray: #b0b0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-black);
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid rgba(197, 168, 128, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .admin-toggle-btn {
            background-color: transparent;
            border: 1px dashed var(--gold);
            color: var(--gold);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .admin-toggle-btn:hover {
            background-color: var(--gold);
            color: var(--dark-black);
        }

        .lang-switcher {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .lang-btn:hover, .lang-btn.active {
            background-color: var(--gold);
            color: var(--dark-black);
        }

        .hero {
            position: relative;
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1920') no-repeat center center/cover;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 48px;
            color: var(--gold);
            margin-bottom: 20px;
            font-weight: 800;
        }

        .hero p {
            font-size: 18px;
            max-width: 700px;
            color: #e0e0e0;
            margin-bottom: 35px;
        }

        .cta-btn {
            background-color: var(--gold);
            color: var(--dark-black);
            border: none;
            padding: 16px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .section-header {
            text-align: center;
            padding: 80px 20px 40px;
        }

        .section-title {
            color: var(--gold);
            font-size: 36px;
        }

        .menu-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 30px;
            padding: 0 20px 80px;
            flex-wrap: wrap;
        }

        .menu-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(197, 168, 128, 0.1);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 320px;
        }

        .menu-img-wrapper {
            position: relative;
            height: 240px;
            width: 100%;
        }

        .menu-img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            background-color: #222;
        }

        .menu-info {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-info h3 {
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 15px;
            text-align: right;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
            margin-top: 15px;
        }

        .price {
            font-size: 22px;
            color: var(--gold);
            font-weight: bold;
        }

        .order-btn {
            background-color: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 22px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        /* تنسيق لوحة الإدارة المخفية التي تظهر عند النقر */
        .admin-edit-box {
            background: #1a1a1a;
            border-top: 1px dashed var(--gold);
            padding: 15px;
            margin-top: 15px;
            display: none; /* مخفية افتراضياً */
        }

        .admin-edit-box.active {
            display: block;
        }

        .admin-edit-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }

        .save-item-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 6px 12px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid rgba(197, 168, 128, 0.1);
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="navLogo">الوردة الذهبية ✨</div>
        <div class="header-actions">
            <button class="admin-toggle-btn" onclick="toggleAdminMode()">⚙️ إدارة القائمة</button>
            <div class="lang-switcher">
                <button class="lang-btn active" onclick="changeLanguage('ar', event)">AR</button>
                <button class="lang-btn" onclick="changeLanguage('en', event)">EN</button>
                <button class="lang-btn" onclick="changeLanguage('fr', event)">FR</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1 id="heroTitle">تذوق الفخامة المطلقة</h1>
        <p id="heroDesc">نقدم لكم أطباقاً ساحرة تم تحضيرها بعناية وشغف لتناسب ذوقكم الرفيع.</p>
        <button class="cta-btn" id="openBookingBtn">احجز طاولتك الآن</button>
    </section>

    <div class="section-header">
        <h2 class="section-title" id="menuTitle">قائمة المأكولات الفاخرة</h2>
    </div>

    <div class="menu-container" id="dynamicMenu"></div>

    <footer>
        <p>© 2026 مطعم الوردة الذهبية الفاخر. جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        // البيانات الأساسية (مطابقة لصورك: برغر، سابا، رولو ميام)
        let defaultMenuItems = [
            { 
                name: "برغر", 
                price: "50", 
                img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=600" 
            },
            { 
                name: "سابا", 
                price: "110", 
                img: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?q=80&w=600" 
            },
            { 
                name: "رولو ميام", 
                price: "80", 
                img: "https://images.unsplash.com/photo-1541544741938-0af808871cc0?q=80&w=600" 
            }
        ];

        // جلب البيانات المخزنة أو البدء بالافتراضية
        let menuItems = JSON.parse(localStorage.getItem('restaurantMenu')) || defaultMenuItems;
        let isAdminMode = false;

        function renderMenu(lang) {
            menuContainer = document.getElementById('dynamicMenu');
            menuContainer.innerHTML = '';
            
            menuItems.forEach((item, index) => {
                let btnText = lang === 'en' ? 'Order Now' : (lang === 'fr' ? 'Commander' : 'اطلب الآن');

                const card = document.createElement('div');
                card.className = 'menu-card';
                card.innerHTML = `
                    <div class="menu-img-wrapper">
                        <img class="menu-img" src="${item.img}" alt="${item.name}">
                    </div>
                    <div class="menu-info">
                        <h3>${item.name}</h3>
                        <div class="price-row">
                            <span class="price">${item.price} DH</span>
                            <button class="order-btn" onclick="alert('تم طلب الطبق بنجاح!')">${btnText}</button>
                        </div>
                        
                        <!-- لوحة التعديل الخاصة بالعامل (تظهر فقط عند تفعيل الإدارة) -->
                        <div class="admin-edit-box ${isAdminMode ? 'active' : ''}" id="edit-box-${index}">
                            <input type="text" id="name-${index}" value="${item.name}" placeholder="اسم الطبق">
                            <input type="text" id="price-${index}" value="${item.price}" placeholder="الثمن">
                            <input type="text" id="img-${index}" value="${item.img}" placeholder="رابط الصورة">
                            <button class="save-item-btn" onclick="saveItem(${index})">💾 حفظ التعديل</button>
                        </div>
                    </div>
                `;
                menuContainer.appendChild(card);
            });
        }

        // تفعيل أو إلغاء وضع الإدارة
        function toggleAdminMode() {
            isAdminMode = !isAdminMode;
            renderMenu('ar');
        }

        // حفظ التعديلات التي يقوم بها العامل
        function saveItem(index) {
            const newName = document.getElementById(`name-${index}`).value;
            const newPrice = document.getElementById(`price-${index}`).value;
            const newImg = document.getElementById(`img-${index}`).value;

            menuItems[index].name = newName;
            menuItems[index].price = newPrice;
            menuItems[index].img = newImg;

            // حفظ التغيير في ذاكرة المتصفح ليبقى حتى بعد إغلاق الصفحة
            localStorage.setItem('restaurantMenu', JSON.stringify(menuItems));
            
            alert("تم حفظ التعديلات بنجاح! ✨");
            renderMenu('ar');
        }

        function changeLanguage(lang, evt) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) evt.target.classList.add('active');
            renderMenu(lang);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderMenu('ar');
        });
    </script>
</body>
</html>
