<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة الأطباق</title>
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: Tahoma, sans-serif; padding: 20px; text-align: center; }
        .box { max-width: 500px; margin: 20px auto; background: #121212; padding: 20px; border-radius: 8px; border: 1px solid #c5a880; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 4px; border: 1px solid #c5a880; background: #1a1a1a; color: white; }
        button { background: #c5a880; color: #000; font-weight: bold; cursor: pointer; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: #121212; }
        th, td { padding: 10px; border: 1px solid #333; text-align: right; }
        th { color: #c5a880; }
        img { width: 50px; height: 50px; object-fit: cover; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1 style="color: #c5a880;">لوحة تحكم الأطباق</h1>
    
    <div class="box">
        <h3>إضافة طبق جديد</h3>
        <input type="text" id="nameInput" placeholder="اسم الطبق">
        <input type="number" id="priceInput" placeholder="السعر بالدرهم">
        <input type="text" id="imgInput" placeholder="رابط الصورة (URL)">
        <button onclick="addItem()">إضافة الطبق للقائمة</button>
    </div>

    <div style="max-width: 800px; margin: 0 auto;">
        <h3>الأطباق الحالية في القائمة</h3>
        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>الاسم</th>
                    <th>السعر</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody id="menuTable"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://vwcpxsabhtojubraiajp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_cnRZjVTJIbTkngCM97VuLA_3R-rf3Y6';
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // تحميل الأطباق فور فتح الصفحة مباشرة
        async function loadItems() {
            const tbody = document.getElementById('menuTable');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">جاري التحميل...</td></tr>';
            const { data, error } = await supabase.from('menu').select('*');
            if (error) { alert('خطأ في التحميل'); return; }
            tbody.innerHTML = '';
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${item.img || ''}"></td>
                        <td>${item.name || ''}</td>
                        <td>${item.price || 0} DH</td>
                        <td><button style="background:#e74c3c; color:white; padding:5px;" onclick="delItem(${item.id})">حذف</button></td>
                    </tr>
                `;
            });
        }

        async function addItem() {
            const name = document.getElementById('nameInput').value;
            const price = document.getElementById('priceInput').value;
            const img = document.getElementById('imgInput').value;
            if (!name || !price) { alert('الرجاء إدخال الاسم والسعر'); return; }
            
            const { error } = await supabase.from('menu').insert([{ name, price, img }]);
            if (error) {
                alert('حدث خطأ أثناء الإضافة: ' + error.message);
            } else {
                alert('تم إضافة الطبق بنجاح!');
                document.getElementById('nameInput').value = '';
                document.getElementById('priceInput').value = '';
                document.getElementById('imgInput').value = '';
                loadItems();
            }
        }

        async function delItem(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                await supabase.from('menu').delete().eq('id', id);
                loadItems();
            }
        }

        // تشغيل الدالة تلقائياً عند تحميل الصفحة
        loadItems();
    </script>
</body>
</html>
